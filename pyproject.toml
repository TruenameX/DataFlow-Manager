[project]
name = "dataflow-manager"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Constantine", email = "melihovks@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.1",
    "cryptography>=50.0.2",
    "fastapi>=0.143.0",
    "psycopg[binary]==3.3.8",
    "sqlalchemy==2.0.57",
    "uvicorn>=0.54.0",
]

[project.scripts]
dataflow-manager = "dataflow_manager:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
