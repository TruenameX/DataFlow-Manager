name: dataflow-manager

services:
  postgres:
    image: docker.io/library/postgres:18.6-bookworm@sha256:9551dd5bf356409a21b31248f49b33bba9bb1877365f3a7e933aecd9af3cf52d
    platform: linux/amd64
    pull_policy: never
    container_name: dataflow-postgres
    network_mode: bridge
    ports:
      - "127.0.0.1:5432:5432"
    cpus: 1.0
    mem_limit: 1g
    # First initialization: leave DATAFLOW_POSTGRES_RESTART_POLICY unset ("no").
    # Only after successful bootstrap, healthy status and explicit acceptance:
    # export DATAFLOW_POSTGRES_RESTART_POLICY=unless-stopped
    # docker compose -f docker/compose.yaml up -d --force-recreate postgres
    # Keep this export in the operating shell for ALL subsequent Compose commands,
    # including config, so the declared policy matches the recreated container.
    # Keep DATAFLOW_SECRETS_DIR set to the same external absolute path.
    # An incomplete initialization requires user intervention; never retry/clean up automatically.
    restart: "${DATAFLOW_POSTGRES_RESTART_POLICY:-no}"
    stop_grace_period: 30s
    environment:
      PGDATA: /var/lib/postgresql/18/docker
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    entrypoint:
      - /bin/bash
      - -euc
      - |
        umask 077
        attempt_marker=/var/lib/postgresql/.dataflow-init-started
        complete_marker="$$PGDATA/.dataflow-bootstrap-complete"

        if [ -s "$$PGDATA/PG_VERSION" ] \
          && [ -f "$$attempt_marker" ] \
          && [ -f "$$complete_marker" ]; then
          :
        elif [ -e "$$attempt_marker" ] \
          || [ -e "$$PGDATA/PG_VERSION" ] \
          || [ -e "$$complete_marker" ]; then
          printf '%s\n' 'STOP: incomplete or unexpected initialization state; user decision required' >&2
          exit 1
        else
          (
            set -o noclobber
            printf '%s\n' 'dataflow initialization attempted' > "$$attempt_marker"
          )

          install -d -m 0700 -o postgres -g postgres \
            /run/dataflow-bootstrap/secrets

          for name in postgres_admin_password dataflow_app_password dataflow_test_password; do
            install -m 0600 -o postgres -g postgres \
              "/run/secrets/$$name" "/run/dataflow-bootstrap/secrets/$$name"
          done

          # postgres must be able to traverse the PostgreSQL 18 parent directory.
          install -d -m 0755 -o postgres -g postgres /var/lib/postgresql/18
        fi

        # Keep initdb's intermediate directories accessible after dropping root.
        umask 022
        exec /usr/local/bin/docker-entrypoint.sh "$$@"
      - dataflow-entrypoint
    command: ["postgres"]
    secrets:
      - postgres_admin_password
      - dataflow_app_password
      - dataflow_test_password
    tmpfs:
      - /run/dataflow-bootstrap:rw,noexec,nosuid,nodev,size=1m,mode=0711
    volumes:
      - dataflow_pgdata:/var/lib/postgresql
      - type: bind
        source: ./bootstrap-postgres.sh
        target: /docker-entrypoint-initdb.d/10-dataflow.sh
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD-SHELL
        - 'test -f "$$PGDATA/.dataflow-bootstrap-complete" && pg_isready -q -h 127.0.0.1 -p 5432 -U postgres -d postgres'
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 120s

volumes:
  dataflow_pgdata:
    name: dataflow_pgdata
    external: true

secrets:
  postgres_admin_password:
    file: ${DATAFLOW_SECRETS_DIR:?Set absolute secrets directory}/postgres_admin_password
  dataflow_app_password:
    file: ${DATAFLOW_SECRETS_DIR:?Set absolute secrets directory}/dataflow_app_password
  dataflow_test_password:
    file: ${DATAFLOW_SECRETS_DIR:?Set absolute secrets directory}/dataflow_test_password
